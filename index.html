body {
  background:
    radial-gradient(ellipse at 50% -10%, #4a1a14 0%, rgba(74, 26, 20, 0) 60%),
    repeating-linear-gradient(45deg, rgba(233, 195, 90, .035) 0 2px, transparent 2px 18px),
    var(--bg);
  color: var(--cream);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#app { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#app input { -webkit-user-select: text; user-select: text; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { height: 100%; display: flex; flex-direction: column; align-items: center; }

/* ------------------------------------------------------------------ HUD */
#hud {
  height: var(--hud-h); width: 100%; max-width: 1500px; padding: 0 16px;
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand-zh { font-family: var(--zh); color: var(--gold); font-weight: 700; letter-spacing: 3px; font-size: 18px; }
.brand-en { font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--cream); }

#timeline {
  list-style: none; margin: 0 auto; padding: 0; display: flex; align-items: center; gap: 0;
  counter-reset: t; flex: 1; justify-content: center; min-width: 0;
}
#timeline li { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; padding: 0 10px; min-width: 0; }
#timeline li + li::before {
  content: ''; position: absolute; top: 6px; right: calc(50% + 7px); width: calc(100% - 14px); height: 2px; background: rgba(251, 244, 227, .18);
}
#timeline li.past + li::before, #timeline li.past + li.now::before { background: var(--gold); }
#timeline .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(251, 244, 227, .35); background: transparent; transition: all .3s; }
#timeline .yr { font-size: 11px; font-weight: 700; color: rgba(251, 244, 227, .45); white-space: nowrap; letter-spacing: .3px; }
#timeline li.past .dot { background: var(--gold); border-color: var(--gold); }
#timeline li.past .yr { color: rgba(233, 195, 90, .8); }
#timeline li.now .dot { background: var(--red); border-color: var(--gold); box-shadow: 0 0 0 4px rgba(184, 49, 43, .35); transform: scale(1.15); }
#timeline li.now .yr { color: var(--cream); }

.hud-btns { display: flex; gap: 8px; flex: none; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(233, 195, 90, .5); background: rgba(0, 0, 0, .25);
  font-size: 18px; cursor: pointer; display: grid; place-items: center; flex: none; color: var(--cream); padding: 0;
}
.icon-btn:hover { background: rgba(233, 195, 90, .15); }
.icon-btn:focus-visible, .btn:focus-visible, .spot:focus-visible, .food-card:focus-visible, .next-action:focus-visible, .tap-pad:focus-visible {
  outline: 3px solid #fff3b0; outline-offset: 3px;
}

/* ------------------------------------------------------------------ stage */
#stage-wrap {
  position: relative;
  width: min(calc(100vw - 24px), calc((100vh - var(--hud-h) - 14px) * 16 / 9), 1500px);
  width: min(calc(100vw - 24px), calc((100dvh - var(--hud-h) - 14px) * 16 / 9), 1500px);
  aspect-ratio: 16 / 9;
  container-type: inline-size;
}
#stage {
  position: absolute; inset: 0; overflow: hidden; border-radius: 14px;
  background: #000;
  box-shadow: 0 0 0 3px var(--gold-dark), 0 0 0 7px var(--red-dark), 0 24px 60px rgba(0, 0, 0, .55);
  cursor: default;
}
#zoom { position: absolute; inset: 0; transition: transform 1.1s cubic-bezier(.45, .05, .25, 1); will-change: transform; }
#scene-host, #scene-host svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* Period color grading (applied to the drawing, not to the UI) */
.scene-svg { transition: filter .6s; }
#stage.g-e1920 .scene-svg { filter: sepia(.85) saturate(.95) contrast(1.06) brightness(1.02); }
#stage.g-e1930 .scene-svg { filter: sepia(.62) saturate(.85) contrast(1.04); }
#stage.g-e1940 .scene-svg { filter: sepia(.42) saturate(.62) contrast(1.06) brightness(.98); }
#stage.g-e1950 .scene-svg { filter: sepia(.22) saturate(1.18) hue-rotate(-6deg) contrast(1.02); }
#stage.g-e1970 .scene-svg { filter: sepia(.3) saturate(1.2) hue-rotate(-10deg) contrast(.95) brightness(1.02); }
#stage.g-e1990 .scene-svg { filter: saturate(.82) contrast(.94) brightness(.97) hue-rotate(4deg); }
#stage.g-e2010 .scene-svg { filter: saturate(1.06) brightness(1.03); }
#stage.g-e2020 .scene-svg { filter: saturate(.72) brightness(.94) contrast(.98); }
#stage.g-e2026 .scene-svg { filter: saturate(1.1) brightness(1.03); }

#grade { position: absolute; inset: 0; pointer-events: none; z-index: 2; transition: opacity .6s; }
#stage[class*='g-'] #grade { background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .35) 100%); }
#stage.g-e1920 #grade, #stage.g-e1930 #grade, #stage.g-e1940 #grade {
  background:
    radial-gradient(ellipse at center, transparent 45%, rgba(40, 20, 5, .55) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain .5s steps(3) infinite;
}
#stage.g-e1950 #grade, #stage.g-e1970 #grade {
  background:
    radial-gradient(ellipse at center, transparent 50%, rgba(60, 25, 0, .38) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 .3 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
@keyframes grain { 0% { background-position: 0 0, 0 0; } 33% { background-position: 0 0, -40px 30px; } 66% { background-position: 0 0, 30px -50px; } }

/* traffic outside the window */
.drive-car .drive-inner { animation: drive 13s linear infinite; }
.drive-walk .drive-inner { animation: walkby 24s linear infinite; animation-delay: -7s; }
@keyframes drive { 0% { transform: translateX(-720px); } 46% { transform: translateX(720px); } 100% { transform: translateX(720px); } }
@keyframes walkby { 0% { transform: translateX(-280px); } 100% { transform: translateX(440px); } }

/* ------------------------------------------------------------------ people */
.actor { cursor: default; transition: filter .25s; }
.actor.clickable { cursor: pointer; }
.actor.clickable:hover { filter: url(#fx-glow); }
.actor.dim { filter: url(#fx-dim); }
.actor .e-closed, .actor .m-open { opacity: 0; }
.actor .e-open { animation: blinkA 4.8s infinite; animation-delay: var(--blink-delay, 0s); }
.actor .e-closed { animation: blinkB 4.8s infinite; animation-delay: var(--blink-delay, 0s); }
@keyframes blinkA { 0%, 95.5% { opacity: 1; } 96%, 98.5% { opacity: 0; } 99%, 100% { opacity: 1; } }
@keyframes blinkB { 0%, 95.5% { opacity: 0; } 96%, 98.5% { opacity: 1; } 99%, 100% { opacity: 0; } }
.actor.talking .m-open { animation: flapA .24s steps(1, end) infinite; }
.actor.talking .m-closed { animation: flapB .24s steps(1, end) infinite; }
@keyframes flapA { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes flapB { 0% { opacity: 0; } 50% { opacity: 1; } }
.actor.talking > .person { animation: bob .42s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
.actor-enter > .person { animation: slidein .7s cubic-bezier(.2, .8, .3, 1) both; }
.cart-enter { animation: slidein .7s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes slidein { from { transform: translateX(-520px); opacity: 0; } to { transform: none; opacity: 1; } }
.dish-new { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: translateY(-30px) scale(.6); } }

/* ------------------------------------------------------------------ hotspots */
#spots { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
#spots > * { pointer-events: auto; }
.is-busy #spots > * { pointer-events: none; }
.is-busy .spot { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
.spot.spot-person { transform: translate(-50%, -100%); }
.is-busy .spot.spot-person { transform: translate(-50%, -100%) scale(.5); }
.hit { cursor: pointer; transition: fill .15s; }
.hit:hover { fill: rgba(255, 243, 176, .16); }
.is-busy .hit { pointer-events: none; }
.is-busy .actor.clickable { cursor: default; }
.spot {
  position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: 0; padding: 0; cursor: pointer; transition: opacity .3s, transform .3s;
}
.spot-icon {
  width: clamp(30px, 3.2cqw, 46px); height: clamp(30px, 3.2cqw, 46px); border-radius: 50%;
  display: grid; place-items: center; font-weight: 800; font-size: clamp(15px, 1.6cqw, 22px); line-height: 1;
  background: var(--cream); color: var(--red); border: 3px solid var(--red);
  box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
}
.spot-required .spot-icon { animation: pulse 1.6s ease-in-out infinite; }
/* stacking: unfinished required markers always win a click/tap over extras and finished ones */
.spot { z-index: 2; }
.spot-optional { z-index: 1; }
.spot-done { z-index: 0; }
.spot-required:not(.spot-done) { z-index: 3; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 243, 176, .85), 0 4px 14px rgba(0, 0, 0, .35); } 60% { box-shadow: 0 0 0 12px rgba(255, 243, 176, 0), 0 4px 14px rgba(0, 0, 0, .35); } }
.spot-optional .spot-icon { width: clamp(24px, 2.4cqw, 34px); height: clamp(24px, 2.4cqw, 34px); background: rgba(251, 244, 227, .85); border-color: var(--gold-dark); color: var(--gold-dark); font-size: clamp(12px, 1.2cqw, 16px); }
.spot-done .spot-icon { background: var(--jade); color: #fff; border-color: #e9f3ee; animation: none; }
.spot-label {
  font-size: clamp(11px, 1.05cqw, 15px); font-weight: 800; color: var(--ink); background: var(--cream); padding: 3px 9px; border-radius: 99px;
  white-space: nowrap; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); opacity: 0; transform: translateY(-4px); transition: all .2s; pointer-events: none;
}
.spot:hover .spot-label, .spot:focus-visible .spot-label, .spot-required:not(.spot-done) .spot-label { opacity: 1; transform: none; }
.spot:hover .spot-icon { transform: scale(1.12); }

/* ------------------------------------------------------------------ era tag, captions, shift */
#era-tag {
  position: absolute; top: 2.2%; left: 1.8%; z-index: 4; display: flex; align-items: baseline; gap: 10px;
  background: rgba(27, 15, 12, .78); border: 2px solid var(--gold-dark); border-radius: 10px; padding: .45cqw 1.1cqw; pointer-events: none;
}
#era-tag b { font-family: var(--display); font-weight: 800; font-size: clamp(16px, 2cqw, 30px); color: var(--gold); }
#era-tag span { font-size: clamp(11px, 1.1cqw, 16px); font-weight: 700; color: var(--cream); text-transform: uppercase; letter-spacing: 1.5px; }
#era-tag:empty { display: none; }

#caption {
  position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; pointer-events: none;
  font-family: var(--display); font-style: italic; font-weight: 800; font-size: clamp(26px, 5cqw, 72px); color: #fff8e6;
  text-shadow: 0 4px 24px rgba(0, 0, 0, .8); background: rgba(20, 10, 6, .45); opacity: 0; transition: opacity .35s;
}
#caption.show { opacity: 1; }
#flash { position: absolute; inset: 0; z-index: 8; background: #fffbe9; opacity: 0; pointer-events: none; }
#flash.go { animation: flash .45s ease-out; }
@keyframes flash { 0% { opacity: 0; } 25% { opacity: .95; } 100% { opacity: 0; } }
#cover { position: absolute; inset: 0; z-index: 8; background: #120a07; opacity: 0; pointer-events: none; transition: opacity .35s; }
#cover.show { opacity: 1; }

#shift { position: absolute; inset: 0; z-index: 9; display: none; place-items: center; overflow: hidden; }
#shift.show { display: grid; animation: shiftIn .7s ease both; }
#shift.out { animation: shiftOut .5s ease both; }
@keyframes shiftIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes shiftOut { to { opacity: 0; } }
#shift .steam {
  position: absolute; inset: -20%;
  background:
    radial-gradient(circle at 30% 70%, rgba(255, 252, 240, .95) 0 18%, transparent 40%),
    radial-gradient(circle at 70% 30%, rgba(255, 248, 230, .95) 0 20%, transparent 42%),
    radial-gradient(circle at 50% 50%, rgba(250, 240, 215, 1) 0 35%, rgba(240, 225, 190, .96) 70%);
  animation: swirl 2.4s ease-in-out both;
}
@keyframes swirl { from { transform: rotate(-12deg) scale(1.3); filter: blur(10px); } to { transform: rotate(8deg) scale(1); filter: blur(2px); } }
.shift-card { position: relative; text-align: center; color: var(--ink); }
.shift-year { font-family: var(--display); font-weight: 800; font-size: clamp(54px, 12cqw, 190px); line-height: .95; color: var(--red); letter-spacing: -2px; animation: rise .9s cubic-bezier(.2, .8, .3, 1) both .15s; }
.shift-title { margin-top: .6cqw; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; font-size: clamp(13px, 1.7cqw, 24px); color: var(--ink); animation: rise .9s cubic-bezier(.2, .8, .3, 1) both .35s; }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } }

/* ------------------------------------------------------------------ panel: dialogue, prompt, next */
#panel { position: absolute; inset: auto 0 0 0; height: 100%; z-index: 5; pointer-events: none; }
#panel > * { pointer-events: auto; }

#dialog {
  position: absolute; left: 3.5%; right: 3.5%; bottom: 3.5%; min-height: 24%;
  background: linear-gradient(#fffaf0, var(--cream));
  border: 3px solid var(--red); outline: 2px solid var(--gold); outline-offset: -9px;
  border-radius: 16px; box-shadow: 0 10px 34px rgba(0, 0, 0, .45);
  padding: 2.4cqw 3cqw 2cqw; color: var(--ink); cursor: pointer;
  opacity: 0; transform: translateY(14px); visibility: hidden; transition: opacity .2s, transform .2s, visibility 0s .2s;
}
#dialog.show { opacity: 1; transform: none; visibility: visible; transition: opacity .2s, transform .2s; }
#nametag {
  position: absolute; top: 0; left: 3.2cqw; transform: translateY(-58%);
  background: var(--red); color: #fff7e0; border: 2px solid var(--gold); border-radius: 99px;
  padding: .35cqw 1.4cqw; font-family: var(--display); font-weight: 800; font-size: clamp(14px, 1.55cqw, 24px); letter-spacing: .5px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, .25); display: none;
}
#nametag.show { display: block; }
#dialog.you #nametag { background: var(--jade); }
#dialog-text { margin: 0; font-size: clamp(15px, 1.85cqw, 28px); line-height: 1.42; font-weight: 600; min-height: 2.8em; }
#dialog.narr #dialog-text { font-style: italic; color: #4e3a2c; font-weight: 600; }
#next-ind { position: absolute; right: 2cqw; bottom: 1.2cqw; color: var(--red); font-size: clamp(14px, 1.5cqw, 22px); opacity: 0; }
#next-ind.show { opacity: 1; animation: nudge .7s ease-in-out infinite alternate; }
@keyframes nudge { to { transform: translateY(5px); } }

#prompt {
  position: absolute; left: 2%; bottom: 3%; display: flex; align-items: center; gap: 12px; max-width: 60%;
  background: rgba(27, 15, 12, .86); color: var(--cream); border: 2px solid var(--gold-dark); border-radius: 99px;
  padding: .7cqw 1.5cqw; font-weight: 700; font-size: clamp(13px, 1.35cqw, 20px);
  opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none;
}
#prompt.show { opacity: 1; transform: none; }
#prompt b { background: var(--gold); color: var(--ink); border-radius: 99px; padding: 1px 10px; font-size: .9em; white-space: nowrap; }

.next-action {
  position: absolute; right: 2%; bottom: 3%; display: none; align-items: center; gap: 12px;
  background: var(--red); color: #fff7e0; border: 3px solid var(--gold); border-radius: 99px; cursor: pointer;
  padding: .9cqw 1.4cqw .9cqw 2cqw; font-family: var(--display); font-weight: 800; font-size: clamp(15px, 1.7cqw, 26px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
}
.next-action.show { display: flex; animation: popin .45s cubic-bezier(.2, 1.5, .4, 1) both; }
.next-action i { font-style: normal; display: grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--gold); color: var(--red-dark); }
.next-action:hover { background: #c83a33; }
.next-action:hover i { transform: translateX(3px); }
@keyframes popin { from { opacity: 0; transform: scale(.7) translateY(16px); } }

/* ------------------------------------------------------------------ tap the table */
.tap-pad {
  position: absolute; left: 27%; right: 27%; bottom: 4%; height: 20%; z-index: 6;
  border: 3px dashed var(--gold); border-radius: 18px; background: rgba(27, 15, 12, .7); color: var(--cream);
  display: flex; align-items: center; justify-content: center; gap: 1.4cqw; cursor: pointer; padding: 0 2cqw;
  font-weight: 800; font-size: clamp(14px, 1.6cqw, 24px); animation: pulseBorder 1.2s ease-in-out infinite;
}
.tap-fingers { font-size: 1.8em; letter-spacing: -6px; }
.tap-count { background: var(--gold); color: var(--ink); border-radius: 99px; padding: 2px 10px; }
.tap-pad.tapped .tap-fingers { animation: tapdown .3s ease; }
@keyframes tapdown { 40% { transform: translateY(8px) scale(.92); } }
@keyframes pulseBorder { 50% { border-color: #fff3b0; } }

/* ------------------------------------------------------------------ overlays / modals */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 16px;
  background: rgba(16, 8, 5, .55); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); overflow: auto;
}
.overlay.show { display: grid; }

.btn {
  border: 2px solid var(--gold-dark); background: var(--cream); color: var(--ink); border-radius: 99px; cursor: pointer;
  padding: 12px 26px; font-weight: 800; font-size: 17px; transition: transform .15s;
}
.btn:hover { transform: translateY(-2px); }
.btn-red { background: var(--red); color: #fff7e0; border-color: var(--gold); }

/* name ticket */
.ticket {
  width: min(380px, calc(100vw - 32px)); background: #fffdf6; color: var(--ink); border-radius: 6px; padding: 22px 24px 26px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .5); display: flex; flex-direction: column; gap: 12px;
  background-image: repeating-linear-gradient(transparent 0 31px, rgba(47, 93, 156, .12) 31px 32px);
  border-top: 10px solid var(--red); animation: popin .4s cubic-bezier(.2, 1.4, .4, 1) both;
  position: relative;
}
.ticket::after { content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px; background: radial-gradient(circle at 10px 0, transparent 7px, #fffdf6 8px) 0 0 / 20px 10px repeat-x; }
.ticket-head { text-align: center; border-bottom: 2px dashed #cbbfa8; padding-bottom: 10px; display: flex; flex-direction: column; gap: 2px; }
.ticket-head span:first-child { font-family: var(--zh); color: var(--red); font-size: 22px; letter-spacing: 6px; font-weight: 700; }
.ticket-head b { font-family: var(--display); letter-spacing: 2px; }
.ticket-head span:last-child { font-size: 13px; color: #7a6a58; }
.ticket label { font-weight: 800; font-size: 15px; color: #5a4a3a; }
.ticket input {
  font: 700 26px/1.2 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', var(--body); color: #1d3d7a; border: 0; border-bottom: 3px solid var(--red);
  background: transparent; padding: 6px 2px; outline: none;
}
.ticket .btn { align-self: flex-end; }

/* food / tea picker */
.menu-card {
  width: min(980px, calc(100vw - 32px)); background: var(--cream); color: var(--ink); border-radius: 18px; padding: 22px 22px 26px;
  border: 4px solid var(--red); outline: 2px solid var(--gold); outline-offset: -11px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  animation: popin .4s cubic-bezier(.2, 1.4, .4, 1) both;
}
.menu-title { text-align: center; font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--red); margin: 4px 0 16px; }
.menu-row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.food-card {
  flex: 1 1 200px; max-width: 260px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 12px 16px;
  background: #fffdf6; border: 2px solid #e1d3b2; border-radius: 14px; cursor: pointer; text-align: center; transition: transform .15s, border-color .15s, box-shadow .15s;
}
.food-card:hover { transform: translateY(-4px); border-color: var(--red); box-shadow: 0 10px 22px rgba(0, 0, 0, .15); }
.food-card svg { width: 100%; max-width: 200px; height: auto; }
.food-en { font-weight: 800; font-size: 17px; }
.food-zh { font-family: var(--zh); color: var(--red); font-size: 18px; letter-spacing: 3px; }
.food-desc { font-size: 13.5px; color: #6a5a48; line-height: 1.35; }

/* about + ending */
.about, .ending {
  width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; background: var(--cream); color: var(--ink);
  border-radius: 18px; padding: 30px 34px; border: 4px solid var(--red); outline: 2px solid var(--gold); outline-offset: -11px;
  position: relative; box-shadow: 0 20px 60px rgba(0, 0, 0, .55); animation: popin .45s cubic-bezier(.2, 1.3, .4, 1) both;
}
.about h2, .ending h2 { font-family: var(--display); font-weight: 800; color: var(--red); margin: 0 0 12px; font-size: 32px; }
.about h3, .ending h3 { font-family: var(--display); margin: 22px 0 8px; font-size: 21px; }
.about .close { position: absolute; top: 12px; right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold-dark); background: #fff; font-size: 24px; cursor: pointer; line-height: 1; }
.notes { padding-left: 20px; line-height: 1.5; font-size: 15px; }
.notes li { margin-bottom: 6px; }
.sources { padding-left: 22px; font-size: 14px; line-height: 1.5; }

.ending { text-align: center; width: min(1000px, calc(100vw - 32px)); padding: 22px 28px 24px; }
.ending-zh { font-family: var(--zh); color: var(--gold-dark); letter-spacing: 8px; font-size: 18px; font-weight: 700; }
.ending h2 { font-size: clamp(28px, 4.2vw, 42px); margin: 2px 0 6px; }
.ending .q { font-size: 16px; font-weight: 700; color: #5a4a3a; max-width: 680px; margin: 0 auto 4px; }
.ingredients { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; text-align: left; }
.ingredients li {
  display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; background: #fffdf6; border: 2px solid #e6d8b8; border-radius: 14px; padding: 6px 12px 6px 6px;
  animation: rise .6s cubic-bezier(.2, .8, .3, 1) both; animation-delay: calc(var(--i) * .12s + .2s);
}
.ingredients li:nth-child(5) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 4px); }
.ingredients svg { width: 72px; height: auto; }
.ingredients b { display: block; font-family: var(--display); font-size: 17px; color: var(--red); }
.ingredients span { font-size: 14px; line-height: 1.35; }
.your-table { margin-top: 10px; }
.your-table h3 { margin: 6px 0 4px; font-size: 19px; }
.minis { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.mini { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 700; width: 96px; }
.mini svg { width: 70px; height: auto; }
.ending-btns { display: flex; gap: 12px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
@media (max-width: 720px) {
  .ingredients { grid-template-columns: 1fr; }
  .ingredients li:nth-child(5) { width: auto; }
}

/* title screen */
.title-screen { position: absolute; inset: 0; z-index: 20; display: none; place-items: end center; padding-bottom: 3.5cqw; }
.title-screen.show { display: grid; }
#title-art, #title-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#title-art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(20, 8, 4, 0) 30%, rgba(20, 8, 4, .75)); }
.title-card {
  position: relative; text-align: center; padding: 1.8cqw 3.4cqw 2cqw; border-radius: 22px;
  background: rgba(251, 244, 227, .95); color: var(--ink); border: 4px solid var(--red); outline: 2px solid var(--gold); outline-offset: -12px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .55); max-width: 72%;
  animation: popin .6s cubic-bezier(.2, 1.3, .4, 1) both .1s;
}
.title-zh { font-family: var(--zh); color: var(--red); font-weight: 700; letter-spacing: 1cqw; font-size: clamp(16px, 1.9cqw, 28px); }
.title-card h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 4.4cqw, 66px); line-height: 1; margin: .3cqw 0 .6cqw; color: var(--ink); letter-spacing: -1px; }
.title-card p { margin: 0 0 1.2cqw; font-weight: 700; color: #5a4a3a; font-size: clamp(13px, 1.3cqw, 19px); }

.title-btns .btn-red { font-size: clamp(16px, 1.8cqw, 24px); padding: .9cqw 3cqw; font-family: var(--display); }

.link-btn { background: none; border: 0; text-decoration: underline; cursor: pointer; font-weight: 700; color: #8e2420; }
.era-jump { margin-top: .9cqw; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; font-size: clamp(11px, 1cqw, 14px); font-weight: 700; color: #7a6a58; }
.era-jump span { margin-right: 2px; }

  border: 1.5px solid #d8c7a2; background: #fffaf0; color: var(--ink); border-radius: 99px; cursor: pointer;
  padding: 3px 9px; font-weight: 800; font-size: clamp(11px, .95cqw, 13px); transition: all .15s;
}
.era-chip:hover, .era-chip:focus-visible { background: var(--red); color: #fff7e0; border-color: var(--gold); outline: none; }

/* ------------------------------------------------------------------ phones: dialogue panel below the picture */
@media (max-aspect-ratio: 4/3) {
  body { overflow: auto; }
  :root { --hud-h: 64px; }
  #hud { flex-wrap: wrap; height: auto; padding: 8px 10px 6px; gap: 8px; }

  #stage-wrap { width: min(100vw, calc((100vh - 64px - 196px) * 16 / 9)); width: min(100vw, calc((100dvh - 64px - 196px) * 16 / 9)); aspect-ratio: auto; }
  #stage { position: relative; aspect-ratio: 16 / 9; border-radius: 0; box-shadow: 0 0 0 2px var(--gold-dark); }
  #panel { position: relative; height: auto; min-height: 190px; padding: 22px 10px 14px; display: flex; flex-direction: column; gap: 10px; }

  .next-action { align-self: stretch; justify-content: space-between; padding: 12px 14px 12px 18px; font-size: 18px; }
  #era-tag { padding: 3px 8px; gap: 6px; }

  .tap-pad { left: 10%; right: 10%; height: 34%; }

}

/* real phones: no full-screen button (unsupported there) and no presenter shortcuts */
@media (max-width: 700px) {
  #fs-btn { display: none !important; }
  .era-jump, .qr-link { display: none; }
  #timeline { padding-right: 86px; }
  .title-card { padding: 8px 14px 10px; max-width: 88%; border-width: 3px; outline-offset: -9px; }
  .title-card p { margin-bottom: 6px; font-size: 12px; }

}

/* phones held upright: a taller 4:3 window onto the scene (only the far edges are trimmed;
   every required person/object stays in view — checked by the marker test) */
@media (max-aspect-ratio: 4/3) and (max-width: 700px) {
  #stage-wrap { width: 100vw; }
  #stage { aspect-ratio: 4 / 3; }
  #zoom { inset: 0 auto 0 50%; width: 133.333%; margin-left: -66.667%; }

  .menu-card { padding: 16px 12px 18px; }
  .menu-title { font-size: 20px; margin-bottom: 10px; }

@media (max-height: 520px) and (min-aspect-ratio: 4/3) {
  :root { --hud-h: 40px; }

}

  .drive-car .drive-inner, .drive-walk .drive-inner { animation: none !important; }
}

  <script>/* js/audio.js */
/*
 * audio.js — NW.audio: every sound in the game, synthesized live with the
 * Web Audio API (no audio files): soft text blips, restaurant sound effects,
 * and a looping period-style music track for every era (1920s gramophone
 * ragtime → 1930s/40s radio swing → 50s doo-wop → 70s disco → 90s boom-bap →
 * 2010s indie pop → 2020 lo-fi → today).
 *
 * Public API (the contract used by ui.js / main.js / the engine):
 *
 *   NW.audio.unlock()            Call from the first user gesture. Creates/resumes the
 *                                AudioContext (browser autoplay policy). Safe to call often.
 *   NW.audio.blip(voice)         Tiny text blip. voices: 'low','mid','high','old','kid',
 *                                'typewriter' (anything else -> 'mid'). Cheap, rate-limited,
 *                                slight random pitch variance. Call every ~2 characters.
 *   NW.audio.sfx(name)           One-shot effect: 'objection','holdit','takethat','damage',
 *                                'evidence','select','click','cursor','reveal','success',
 *                                'gameover','shake','flash','door_bell','gong','sizzle',
 *                                'page','whoosh','typewriter_card','fanfare'.
 *                                Unknown names play a soft click.
 *   NW.audio.music(name[, opts]) Crossfade to a looping track (see TRACKS below).
 *                                null / '' stops. Same name as current = no-op.
 *                                Requested before unlock() -> starts on unlock.
 *                                opts (optional): { fade: seconds, fadeIn: seconds }
 *   NW.audio.setVolume({ master, music, sfx, blips })   each 0..1 (partial objects OK)
 *   NW.audio.getSettings()       -> { master, music, sfx, blips, muted } (a copy)
 *   NW.audio.setMuted(bool) / NW.audio.isMuted()
 *
 *   Extras (handy for tools/UI, not required by the engine):
 *   NW.audio.available           true if Web Audio exists in this environment
 *   NW.audio.list()              -> { tracks:[...], sfx:[...], voices:[...] }
 *   NW.audio.currentMusic()      -> name of the requested track or null
 *
 * Design notes
 *   - Nothing touches AudioContext at load time. The context is created lazily
 *     inside unlock(), so this file loads in Node (tools/*.js) and in browsers
 *     without Web Audio; there every method is a silent no-op.
 *   - Settings persist to localStorage['nomwah-audio-v1'] (guarded).
 *   - Mixer: music -> duck -> tone filter ┐
 *                         sfx ───────────┼-> master -> compressor -> speakers
 *                         blips ─────────┘
 *     Shouts briefly "duck" the music like Ace Attorney does.
 *   - Music uses a lookahead scheduler: a 25ms setInterval schedules notes ~150ms
 *     ahead against audioContext.currentTime, so tempo never drifts and loops are
 *     sample-accurate. When the tab is hidden the context is suspended.
 *   - A track is pure data: tempo, a chord progression, and "parts". A part is
 *     either a melody string, a generator driven by the progression (arpeggio,
 *     chord comping, bass figure), or drum lanes. Every part loops on its own
 *     length, so an 8-bar progression can sit under a 16-bar melody.
 *   - Raw square waves are harsh, so all "square/pulse" voices use band-limited
 *     custom PeriodicWaves with tapered harmonics, plus per-voice low-pass filters
 *     and a gentle master low-pass on the music bus.
 */
(function (root) {
  'use strict';

  var NW = (root.NW = root.NW || {});

  // ===========================================================================
  // Small helpers
  // ===========================================================================

  function noop() {}
  function clamp01(v) { v = +v; return isFinite(v) ? Math.max(0, Math.min(1, v)) : 0; }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function mod(a, n) { return ((a % n) + n) % n; }
  function rep(s, n) { var o = ''; for (var i = 0; i < n; i++) o += s; return o; }
  function extend(dst) {
    for (var i = 1; i < arguments.length; i++) {
      var src = arguments[i];
      if (src) for (var k in src) if (Object.prototype.hasOwnProperty.call(src, k)) dst[k] = src[k];
    }
    return dst;
  }
  function gcd(a, b) { while (b) { var t = b; b = a % b; a = t; } return a; }
  function quiet(promise) { if (promise && typeof promise.then === 'function') promise.then(noop, noop); }

  var warned = {};
  function warnOnce(msg) {
    if (warned[msg]) return;
    warned[msg] = true;
    try { if (root.console && root.console.warn) root.console.warn('[NW.audio] ' + msg); } catch (e) { /* ignore */ }
  }

  // ===========================================================================
  // Settings (persisted)
  // ===========================================================================

  var STORAGE_KEY = 'nomwah-audio-v1';
  var VOL_KEYS = ['master', 'music', 'sfx', 'blips'];
  var DEFAULTS = { master: 0.8, music: 0.35, sfx: 0.8, blips: 0.5, muted: false };

  function storage() {
    try { return root.localStorage || null; } catch (e) { return null; } // SecurityError in sandboxed frames
  }

  function loadSettings() {
    var s = extend({}, DEFAULTS);
    try {
      var ls = storage();
      var raw = ls && ls.getItem(STORAGE_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && typeof o === 'object') {
          VOL_KEYS.forEach(function (k) { if (typeof o[k] === 'number' && isFinite(o[k])) s[k] = clamp01(o[k]); });
          if (typeof o.muted === 'boolean') s.muted = o.muted;
        }
      }
    } catch (e) { /* corrupt / unavailable storage: keep defaults */ }
    return s;
  }

  function saveSettings() {
    try {
      var ls = storage();
      if (ls) ls.setItem(STORAGE_KEY, JSON.stringify(settings));
    } catch (e) { /* quota / private mode: ignore */ }
  }

  var settings = loadSettings();

  // ===========================================================================
  // Context + mixer graph (created lazily in unlock())
  // ===========================================================================

  var AC = root.AudioContext || root.webkitAudioContext || null;
  var ctx = null;          // the AudioContext
  var bus = null;          // { master, comp, music, duck, tone, sfx, blips }
  var waves = {};          // custom PeriodicWaves by name
  var noiseBuf = null;     // shared white-noise buffer
  var unlocked = false;    // unlock() has been called at least once
  var hiddenPause = false; // context suspended because the tab is hidden

  function docHidden() {
    try { return typeof document !== 'undefined' && !!document.hidden; } catch (e) { return false; }
  }

  // Self-healing: if the audio device fails (e.g. a laptop is plugged into a projector and the
  // output switches), mark the context broken; the next click rebuilds it and restarts the music.
  var broken = false, ctxGen = 0;
  function watchHealth(c) {
    try {
      c.addEventListener('statechange', function () { if (c === ctx && c.state === 'closed') broken = true; });
      c.addEventListener('error', function () { if (c === ctx) broken = true; });
    } catch (e) { /* older browsers: nothing to watch */ }
  }
  function rebuildCtx() {
    var old = ctx;
    broken = false;
    if (timer) { clearInterval(timer); timer = null; }
    current = null; fading = [];
    ctx = null; bus = null; waves = {}; noiseBuf = null;
    unlocked = false; // unlock() redoes the first-gesture setup and restarts the wanted track
    try { if (old && old.state !== 'closed') quiet(old.close()); } catch (e) { /* ignore */ }
  }

  function ensureCtx() {
    if (ctx) return ctx;
    if (!AC) return null;
    try {
      try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e1) { ctx = new AC(); }
      ctxGen++;
      watchHealth(ctx);
      buildGraph();
    } catch (e) {
      warnOnce('Web Audio unavailable: ' + (e && e.message));
      ctx = null; bus = null; AC = null;
      return null;
    }
    return ctx;
  }

  /** Build buses, shared waves and noise on the current `ctx`. */
  function buildGraph() {
    var c = ctx;
    var comp = c.createDynamicsCompressor();       // safety limiter on the final mix
    comp.threshold.value = -12;
    comp.knee.value = 10;
    comp.ratio.value = 6;
    comp.attack.value = 0.003;
    comp.release.value = 0.2;

    var master = c.createGain();
    var music = c.createGain();
    var duck = c.createGain();
    var tone = c.createBiquadFilter();             // softens the whole music bus a touch
    tone.type = 'lowpass';
    tone.frequency.value = 6500;
    tone.Q.value = 0.5;
    var sfx = c.createGain();
    var blips = c.createGain();

    music.connect(duck); duck.connect(tone); tone.connect(master);
    sfx.connect(master);
    blips.connect(master);
    master.connect(comp); comp.connect(c.destination);

    bus = { master: master, comp: comp, music: music, duck: duck, tone: tone, sfx: sfx, blips: blips };

    waves = {
      pulse12: makePulse(c, 0.125),
      pulse25: makePulse(c, 0.25),
      square: makePulse(c, 0.5)
    };
    noiseBuf = makeNoise(c, 1.5);
    applyVolumes(true);
  }

  /**
   * Band-limited pulse wave with duty cycle `duty` as a PeriodicWave.
   * Fourier series of a pulse: a_k = 2/(k*pi) * sin(k*pi*duty) (cosine terms).
   * Harmonics are tapered so the chip voices are bright but never piercing.
   */
  function makePulse(c, duty) {
    var n = 28, real = new Float32Array(n), imag = new Float32Array(n);
    for (var k = 1; k < n; k++) real[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty) * Math.pow(0.95, k);
    return c.createPeriodicWave(real, imag);
  }

  function makeNoise(c, seconds) {
    var len = Math.floor(c.sampleRate * seconds), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function setWave(osc, name) {
    if (waves[name]) osc.setPeriodicWave(waves[name]);
    else osc.type = name || 'sine'; // 'sine' | 'triangle' | 'sawtooth'
  }

  /** Freeze an AudioParam at its current value at time t so new ramps start from there. */
  function holdParam(p, t) {
    if (typeof p.cancelAndHoldAtTime === 'function') {
      p.cancelAndHoldAtTime(t);
    } else {
      var v = p.value;
      p.cancelScheduledValues(t);
      p.setValueAtTime(v, t);
    }
  }

  function smoothSet(p, v, immediate) {
    var t = ctx.currentTime;
    if (immediate) { p.cancelScheduledValues(t); p.setValueAtTime(v, t); return; }
    holdParam(p, t);
    p.setTargetAtTime(v, t, 0.03);
  }

  function applyVolumes(immediate) {
    if (!ctx || !bus) return;
    smoothSet(bus.master.gain, settings.muted ? 0 : settings.master, immediate);
    smoothSet(bus.music.gain, settings.music, immediate);
    smoothSet(bus.sfx.gain, settings.sfx, immediate);
    smoothSet(bus.blips.gain, settings.blips, immediate);
  }

  /** True when a sound on bus `kind` would be heard right now. */
  function audible(kind) {
    if (!ctx || !bus || !unlocked || hiddenPause || ctx.state === 'closed') return false;
    if (settings.muted || settings.master <= 0) return false;
    return !kind || settings[kind] > 0;
  }

  /** Temporarily lower the music (shouts, game over). */
  function duck(depth, hold, t) {
    var p = bus.duck.gain;
    holdParam(p, t);
    p.linearRampToValueAtTime(depth, t + 0.03);
    p.setValueAtTime(depth, t + 0.03 + hold);
    p.linearRampToValueAtTime(1, t + 0.6 + hold);
  }

  // ===========================================================================
  // Voice primitives (shared by blips, SFX, drums)
  // ===========================================================================

  /** Exponential AD(H) envelope on a gain AudioParam. */
  function env(p, t, a, hold, dur, peak) {
    peak = Math.max(0.0002, peak);
    a = Math.max(0.001, a);
    p.setValueAtTime(0.0001, t);
    p.exponentialRampToValueAtTime(peak, t + a);
    if (hold > 0) p.setValueAtTime(peak, t + a + hold);
    p.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, a + (hold || 0) + 0.01));
  }

  /**
   * One oscillator note with an envelope.
   * o: { wave, f, f2, glide, t, dur, a, hold, peak, cut, cut2, q, ftype, detune }
   */
  function tone(dest, o) {
    var c = ctx, t = o.t, end = t + o.dur;
    var osc = c.createOscillator();
    setWave(osc, o.wave || 'sine');
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + (o.glide || o.dur));
    if (o.detune) osc.detune.setValueAtTime(o.detune, t);
    var g = c.createGain();
    env(g.gain, t, o.a || 0.003, o.hold || 0, o.dur, o.peak);
    if (o.cut) {
      var f = c.createBiquadFilter();
      f.type = o.ftype || 'lowpass';
      f.Q.value = o.q || 0.7;
      f.frequency.setValueAtTime(o.cut, t);
      if (o.cut2) f.frequency.exponentialRampToValueAtTime(o.cut2, end);
      osc.connect(f); f.connect(g);
    } else {
      osc.connect(g);
    }
    g.connect(dest);
    osc.start(t);
    osc.stop(end + 0.05);
  }

  /**
   * Filtered white-noise burst.
   * o: { t, dur, a, hold, peak, ftype, f, f2, glide, q }
   */
  function noise(dest, o) {
    var c = ctx, t = o.t, end = t + o.dur;
    var src = c.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    var flt = c.createBiquadFilter();
    flt.type = o.ftype || 'bandpass';
    flt.Q.value = o.q == null ? 1 : o.q;
    flt.frequency.setValueAtTime(o.f || 2000, t);
    if (o.f2) flt.frequency.exponentialRampToValueAtTime(o.f2, t + (o.glide || o.dur));
    var g = c.createGain();
    env(g.gain, t, o.a || 0.002, o.hold || 0, o.dur, o.peak);
    src.connect(flt); flt.connect(g); g.connect(dest);
    src.start(t, Math.random() * 1.2);
    src.stop(end + 0.05);
  }

  /**
   * Brassy chord stab: detuned saw + pulse per note through one swept low-pass.
   * o: { dur, a, hold, peak, cut, cut2, q, spread, detune, bend, wave, wave2 }
   */
  function stab(dest, t, notes, o) {
    var c = ctx, dur = o.dur, end = t + dur;
    var fl = c.createBiquadFilter();
    fl.type = 'lowpass';
    fl.Q.value = o.q || 1.4;
    fl.frequency.setValueAtTime(o.cut || 4500, t);
    fl.frequency.exponentialRampToValueAtTime(o.cut2 || 700, end);
    var g = c.createGain();
    env(g.gain, t, o.a || 0.004, o.hold || 0, dur, o.peak / Math.sqrt(notes.length * 2));
    fl.connect(g); g.connect(dest);
    var det = o.detune == null ? 8 : o.detune;
    for (var i = 0; i < notes.length; i++) {
      var st = t + (o.spread || 0) * i, f = mtof(notes[i]);
      for (var k = 0; k < 2; k++) {
        var osc = c.createOscillator();
        setWave(osc, k ? (o.wave2 || 'pulse25') : (o.wave || 'sawtooth'));
        osc.frequency.setValueAtTime(f, st);
        if (o.bend) {
          osc.frequency.setValueAtTime(f, t + dur * 0.55);
          osc.frequency.exponentialRampToValueAtTime(f * Math.pow(2, o.bend / 12), end);
        }
        osc.detune.setValueAtTime(k ? det : -det, st);
        osc.connect(fl);
        osc.start(st);
        osc.stop(end + 0.05);
      }
    }
  }

  /** Metallic bell: a few inharmonic sine partials. */
  function bell(dest, t, f, peak, dur) {
    tone(dest, { wave: 'sine', f: f, t: t, dur: dur, a: 0.002, peak: peak });
    tone(dest, { wave: 'sine', f: f * 2.76, t: t, dur: dur * 0.6, a: 0.002, peak: peak * 0.4 });
    tone(dest, { wave: 'sine', f: f * 5.4, t: t, dur: dur * 0.35, a: 0.002, peak: peak * 0.18 });
  }

  // ===========================================================================
  // Text blips
  // ===========================================================================

  var BLIP_MIN_GAP = 0.045; // seconds; blip() calls closer than this are dropped
  var VOICES = {
    low:        { wave: 'sine',     f: 175, f2: 155, dur: 0.06,  cut: 1400, peak: 0.30 },
    mid:        { wave: 'triangle', f: 255, f2: 235, dur: 0.05,  cut: 2000, peak: 0.24 },
    high:       { wave: 'triangle', f: 395, f2: 370, dur: 0.045, cut: 2600, peak: 0.20 },
    old:        { wave: 'sine',     f: 205, f2: 175, dur: 0.07,  cut: 1500, peak: 0.30 },
    kid:        { wave: 'triangle', f: 560, f2: 520, dur: 0.04,  cut: 3200, peak: 0.17 },
    narr:       { wave: 'sine',     f: 520, f2: 500, dur: 0.03,  cut: 2400, peak: 0.07 },
    typewriter: { noise: true }
  };
  var lastBlip = -1;

  function blip(voice) {
    if (!audible('blips')) return;
    var t = ctx.currentTime;
    if (lastBlip >= 0 && t >= lastBlip && t - lastBlip < BLIP_MIN_GAP) return;
    lastBlip = t;
    var V = VOICES[voice] || VOICES.mid;
    var j = 1 + (Math.random() * 2 - 1) * 0.05; // ±5% pitch variance
    t += 0.002;
    try {
      if (V.noise) {
        noise(bus.blips, { t: t, dur: 0.028, a: 0.001, peak: 0.45, ftype: 'bandpass', f: 2600 * j, q: 2.5 });
        tone(bus.blips, { wave: 'sine', f: 1100 * j, f2: 700, t: t, dur: 0.03, peak: 0.14 });
      } else {
        tone(bus.blips, {
          wave: V.wave, f: V.f * j, f2: V.f2 ? V.f2 * j : 0, t: t, dur: V.dur,
          a: 0.002, hold: V.dur * 0.4, peak: V.peak, cut: V.cut
        });
      }
    } catch (e) { warnOnce('blip failed: ' + (e && e.message)); }
  }

  // ===========================================================================
  // Sound effects. Each entry: function (t, dest) scheduling nodes at time t.
  // ===========================================================================

  var SFX = {
    // --- Shouts: punchy noise crack + low thump + big chord stab, and the music ducks.
    objection: function (t, d) {
      duck(0.25, 0.5, t);
      noise(d, { t: t, dur: 0.22, a: 0.001, peak: 0.55, ftype: 'bandpass', f: 3500, f2: 700, q: 0.8 });
      tone(d, { wave: 'sine', f: 170, f2: 40, t: t, dur: 0.35, a: 0.002, peak: 0.8 });
      stab(d, t, [50, 57, 62], { dur: 0.09, peak: 0.45, cut: 3000, cut2: 1500 });                // grace hit
      stab(d, t + 0.075, [50, 57, 62, 66, 69, 74], {                                              // D major blast, sagging a semitone
        dur: 0.75, a: 0.004, hold: 0.12, peak: 0.6, cut: 6000, cut2: 600, spread: 0.008, bend: -1
      });
      tone(d, { wave: 'sine', f: 2349, t: t + 0.08, dur: 0.4, peak: 0.05 });                      // shine
    },
    holdit: function (t, d) {
      // "HOLD — IT!": two descending stabs
      duck(0.3, 0.45, t);
      noise(d, { t: t, dur: 0.16, a: 0.001, peak: 0.4, ftype: 'bandpass', f: 2500, f2: 800, q: 0.9 });
      tone(d, { wave: 'sine', f: 150, f2: 45, t: t, dur: 0.25, peak: 0.6 });
      stab(d, t, [57, 64, 69, 73], { dur: 0.13, peak: 0.5, cut: 4500, cut2: 1800 });
      tone(d, { wave: 'sine', f: 130, f2: 40, t: t + 0.14, dur: 0.3, peak: 0.7 });
      stab(d, t + 0.14, [53, 60, 65, 69, 72], { dur: 0.6, hold: 0.1, peak: 0.6, cut: 5000, cut2: 600, spread: 0.006 });
    },
    takethat: function (t, d) {
      // rising zip, then a bright E major stab with sparkles
      duck(0.3, 0.45, t);
      tone(d, { wave: 'pulse25', f: 220, f2: 1760, glide: 0.13, t: t, dur: 0.16, peak: 0.22, cut: 3500 });
      noise(d, { t: t, dur: 0.15, peak: 0.18, ftype: 'highpass', f: 1500, f2: 5000 });
      noise(d, { t: t + 0.13, dur: 0.2, a: 0.001, peak: 0.45, ftype: 'bandpass', f: 3000, f2: 900, q: 0.8 });
      tone(d, { wave: 'sine', f: 160, f2: 45, t: t + 0.13, dur: 0.3, peak: 0.7 });
      stab(d, t + 0.13, [52, 59, 64, 68, 71, 76], { dur: 0.65, hold: 0.1, peak: 0.6, cut: 6500, cut2: 900, spread: 0.01 });
      tone(d, { wave: 'sine', f: 2637, t: t + 0.2, dur: 0.35, peak: 0.06 });
      tone(d, { wave: 'sine', f: 3520, t: t + 0.27, dur: 0.3, peak: 0.04 });
    },

    // --- Feedback
    damage: function (t, d) {
      noise(d, { t: t, dur: 0.32, a: 0.001, peak: 0.6, ftype: 'lowpass', f: 1800, f2: 200, q: 0.7 });
      tone(d, { wave: 'pulse25', f: 200, f2: 50, t: t, dur: 0.34, peak: 0.35, cut: 1100 });
      tone(d, { wave: 'sine', f: 95, f2: 38, t: t, dur: 0.3, peak: 0.7 });
    },
    evidence: function (t, d) {
      // "Evidence added to the Order Book" jingle
      var arp = [72, 76, 79, 84, 88];
      for (var i = 0; i < arp.length; i++) tone(d, { wave: 'pulse25', f: mtof(arp[i]), t: t + i * 0.055, dur: 0.22, hold: 0.03, peak: 0.15, cut: 4200 });
      tone(d, { wave: 'triangle', f: mtof(84), t: t + 0.28, dur: 0.6, peak: 0.18 });
      bell(d, t + 0.28, 2093, 0.07, 0.8);
    },
    select: function (t, d) {
      tone(d, { wave: 'pulse25', f: 659, t: t, dur: 0.06, hold: 0.02, peak: 0.13, cut: 3200 });
      tone(d, { wave: 'pulse25', f: 988, t: t + 0.05, dur: 0.1, hold: 0.02, peak: 0.13, cut: 3600 });
    },
    click: function (t, d) {
      tone(d, { wave: 'sine', f: 1500, f2: 700, t: t, dur: 0.035, peak: 0.2 });
      noise(d, { t: t, dur: 0.015, a: 0.001, peak: 0.06, ftype: 'highpass', f: 4500 });
    },
    cursor: function (t, d) {
      tone(d, { wave: 'pulse12', f: 1047, t: t, dur: 0.028, hold: 0.01, peak: 0.08, cut: 3500 });
    },
    reveal: function (t, d) {
      tone(d, { wave: 'triangle', f: 330, f2: 1320, t: t, dur: 0.36, a: 0.02, peak: 0.2 });
      noise(d, { t: t, dur: 0.36, a: 0.15, peak: 0.12, ftype: 'bandpass', f: 600, f2: 4000, q: 1.2 });
      bell(d, t + 0.32, 1568, 0.09, 0.7);
      bell(d, t + 0.32, 2349, 0.05, 0.6);
    },
    success: function (t, d) {
      var arp = [72, 76, 79, 84];
      for (var i = 0; i < arp.length; i++) tone(d, { wave: 'pulse25', f: mtof(arp[i]), t: t + i * 0.07, dur: 0.18, hold: 0.04, peak: 0.14, cut: 3800 });
      for (var k = 0; k < arp.length; k++) {
        tone(d, { wave: 'triangle', f: mtof(arp[k]), t: t + 0.3, dur: 0.7, hold: 0.1, peak: 0.1 });
        tone(d, { wave: 'pulse12', f: mtof(arp[k]), t: t + 0.3, dur: 0.5, peak: 0.03, cut: 2500 });
      }
    },
    gameover: function (t, d) {
      // slow, sad descent; music dips for the duration
      duck(0.15, 1.6, t);
      var notes = [67, 63, 60, 55];
      for (var i = 0; i < notes.length; i++) {
        var last = i === notes.length - 1, st = t + i * 0.34, f = mtof(notes[i]);
        tone(d, { wave: 'triangle', f: f, f2: last ? f * 0.97 : 0, t: st, dur: last ? 1.6 : 0.32, hold: last ? 0.4 : 0.1, peak: 0.3 });
        tone(d, { wave: 'pulse25', f: f, f2: last ? f * 0.97 : 0, t: st, dur: last ? 1.3 : 0.3, hold: last ? 0.3 : 0.08, peak: 0.08, cut: 1400 });
      }
    },

    // --- Stage effects
    shake: function (t, d) {
      noise(d, { t: t, dur: 0.5, a: 0.005, peak: 0.7, ftype: 'lowpass', f: 300, q: 0.7 });
      tone(d, { wave: 'sine', f: 55, f2: 35, t: t, dur: 0.5, peak: 0.45 });
    },
    flash: function (t, d) {
      noise(d, { t: t, dur: 0.32, a: 0.02, peak: 0.2, ftype: 'highpass', f: 4000, q: 0.7 });
      bell(d, t + 0.01, 2637, 0.05, 0.6);
    },
    whoosh: function (t, d) {
      var c = ctx, src = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
      src.buffer = noiseBuf; src.loop = true;
      flt.type = 'bandpass'; flt.Q.value = 1.4;
      flt.frequency.setValueAtTime(250, t);
      flt.frequency.exponentialRampToValueAtTime(2200, t + 0.22);
      flt.frequency.exponentialRampToValueAtTime(450, t + 0.5);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.4, t + 0.18);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      src.connect(flt); flt.connect(g); g.connect(d);
      src.start(t, Math.random()); src.stop(t + 0.55);
    },
    page: function (t, d) {
      noise(d, { t: t, dur: 0.16, a: 0.02, peak: 0.22, ftype: 'bandpass', f: 1200, f2: 4500, q: 1.2 });
      noise(d, { t: t + 0.09, dur: 0.12, a: 0.01, peak: 0.1, ftype: 'bandpass', f: 2500, f2: 6000, q: 1.2 });
    },
    typewriter_card: function (t, d) {
      // single clack (the time/place card calls this per character)
      noise(d, { t: t, dur: 0.03, a: 0.001, peak: 0.28, ftype: 'highpass', f: 2500 });
      tone(d, { wave: 'sine', f: 220 * (0.95 + Math.random() * 0.1), f2: 110, t: t, dur: 0.05, peak: 0.16 });
    },

    // --- Places & things
    door_bell: function (t, d) {
      // shop bell on a spring: "ting-a-ling"
      var hits = [[0, 1], [0.085, 0.7], [0.16, 0.55], [0.27, 0.35]];
      for (var i = 0; i < hits.length; i++) bell(d, t + hits[i][0], 2150 * (1 + (i % 2) * 0.012), 0.1 * hits[i][1], 0.9);
    },
    gong: function (t, d) {
      var base = 98;
      var partials = [[1, 0.5, 4.0], [1.52, 0.3, 3.2], [2.03, 0.28, 2.8], [2.61, 0.2, 2.2], [3.28, 0.14, 1.6], [4.12, 0.09, 1.2], [5.5, 0.05, 0.8]];
      for (var i = 0; i < partials.length; i++) {
        var p = partials[i];
        tone(d, { wave: 'sine', f: base * p[0] * 1.03, f2: base * p[0], glide: 0.5, t: t, a: 0.012, dur: p[2], peak: p[1] * 0.42 });
      }
      noise(d, { t: t, a: 0.02, dur: 1.4, peak: 0.1, ftype: 'lowpass', f: 1800, f2: 300, q: 0.5 });
      tone(d, { wave: 'sine', f: 70, f2: 55, t: t, dur: 0.6, peak: 0.35 }); // mallet thump
    },
    sizzle: function (t, d) {
      // wok sizzle: a hiss bed plus random fat-crackles
      noise(d, { t: t, dur: 1.4, a: 0.06, hold: 0.7, peak: 0.1, ftype: 'highpass', f: 3000, q: 0.5 });
      for (var i = 0; i < 28; i++) {
        noise(d, {
          t: t + Math.random() * 1.2, dur: 0.015 + Math.random() * 0.03, a: 0.001,
          peak: 0.08 + Math.random() * 0.17, ftype: 'bandpass', f: 2500 + Math.random() * 4500, q: 4
        });
      }
    },

    // --- Celebration
    fanfare: function (t, d) {
      var lead = [[67, 0], [72, 0.12], [76, 0.24]];
      for (var i = 0; i < lead.length; i++) stab(d, t + lead[i][1], [lead[i][0], lead[i][0] - 12], { dur: 0.12, a: 0.01, peak: 0.32, cut: 1800, cut2: 2600, detune: 6 });
      stab(d, t + 0.36, [79, 67], { dur: 0.34, a: 0.012, hold: 0.12, peak: 0.34, cut: 1500, cut2: 2800, detune: 6 });
      for (var k = 0; k < 6; k++) noise(d, { t: t + 0.48 + k * 0.04, dur: 0.06, peak: 0.1 + k * 0.03, ftype: 'bandpass', f: 2000, q: 0.7 }); // snare roll
      tone(d, { wave: 'sine', f: 140, f2: 45, t: t + 0.72, dur: 0.3, peak: 0.6 });
      noise(d, { t: t + 0.72, dur: 1.3, a: 0.003, peak: 0.12, ftype: 'highpass', f: 5000, q: 0.5 });        // cymbal
      stab(d, t + 0.72, [60, 64, 67, 72, 76, 79], { dur: 1.25, a: 0.03, hold: 0.35, peak: 0.5, cut: 3200, cut2: 900, detune: 7 });
    },

    // Fallback for unknown names
    // --- Restaurant sounds -------------------------------------------------
    // Tea pouring from a pot: a bright gurgling stream that rises as the cup fills.
    pour: function (t, d) {
      noise(d, { t: t, dur: 1.25, a: 0.08, hold: 0.8, peak: 0.16, ftype: 'bandpass', f: 900, f2: 2600, glide: 1.2, q: 2.2 });
      for (var i = 0; i < 9; i++) {
        tone(d, { wave: 'sine', f: 520 + i * 55 + Math.random() * 80, f2: 900 + i * 60, t: t + 0.1 + i * 0.12, dur: 0.07, a: 0.005, peak: 0.035 });
      }
    },
    // Two fingers tapping the tabletop ("thank you" for the tea).
    tap: function (t, d) {
      tone(d, { wave: 'sine', f: 240, f2: 110, t: t, dur: 0.09, a: 0.001, peak: 0.45 });
      noise(d, { t: t, dur: 0.04, a: 0.001, peak: 0.18, ftype: 'bandpass', f: 1500, q: 1.5 });
    },
    // Little two-note bell, for new dishes on your table.
    chime: function (t, d) {
      bell(d, t, 1318.5, 0.12, 0.9);
      bell(d, t + 0.11, 1760, 0.1, 1.1);
    },
    // Phone camera shutter.
    shutter: function (t, d) {
      noise(d, { t: t, dur: 0.05, a: 0.001, peak: 0.3, ftype: 'highpass', f: 2500 });
      noise(d, { t: t + 0.07, dur: 0.06, a: 0.001, peak: 0.22, ftype: 'bandpass', f: 1800, q: 1.2 });
    },
    // A dim sum cart's squeaky wheel.
    squeak: function (t, d) {
      tone(d, { wave: 'sine', f: 1900, f2: 2300, t: t, dur: 0.12, a: 0.01, peak: 0.05 });
      tone(d, { wave: 'sine', f: 2100, f2: 1750, t: t + 0.18, dur: 0.14, a: 0.01, peak: 0.04 });
      noise(d, { t: t, dur: 0.5, a: 0.05, peak: 0.03, ftype: 'lowpass', f: 400 });
    },
    // Footstep on pavement.
    step: function (t, d) {
      noise(d, { t: t, dur: 0.09, a: 0.002, peak: 0.25, ftype: 'lowpass', f: 900, f2: 300 });
      tone(d, { wave: 'sine', f: 90, f2: 60, t: t, dur: 0.08, peak: 0.2 });
    },
    // Time shift: rising steam whoosh, ticking clock, a shimmer at the top.
    timeshift: function (t, d) {
      duck(0.35, 1.2, t);
      noise(d, { t: t, dur: 1.6, a: 0.5, peak: 0.16, ftype: 'bandpass', f: 300, f2: 3800, glide: 1.4, q: 0.9 });
      for (var i = 0; i < 6; i++) tone(d, { wave: 'sine', f: 2400, t: t + 0.1 + i * 0.16, dur: 0.03, a: 0.001, peak: 0.05 });
      [72, 76, 79, 84].forEach(function (m, k) { bell(d, t + 1.05 + k * 0.06, mtof(m), 0.05, 1.2); });
    },
    _default: function (t, d) {
      tone(d, { wave: 'sine', f: 1200, f2: 800, t: t, dur: 0.03, peak: 0.12 });

        { inst: 'flute', notes: 'A5:4 G5:2 E5:2 r:8 | G5:4 E5:2 D5:2 r:8 | F5:4 E5:2 C5:2 r:8 | E5:8 r:8', gain: 0.55 },

  // Parts with `ref` double another part's melody (e.g. an octave down).
  Object.keys(TRACKS).forEach(function (name) {
    var parts = TRACKS[name].parts;
    parts.forEach(function (p) {
      if (!p.ref) return;
      for (var i = 0; i < parts.length; i++) if (parts[i] !== p && parts[i].inst === p.ref && parts[i].notes) { p.notes = parts[i].notes; return; }
      throw new Error('[NW.audio] track ' + name + ': ref "' + p.ref + '" not found');
    });
  });

  // ===========================================================================
  // Music: playback (lookahead scheduler)
  // ===========================================================================

  var LOOKAHEAD = 0.15; // seconds of audio scheduled ahead
  var TICK_MS = 25;     // scheduler wake-up interval
  var current = null;   // playing track instance
  var fading = [];      // instances fading out
  var wantTrack = null; // last requested track name (survives until unlock)
  var timer = null;

  function startTrack(name, opts) {
    var def = compileTrack(name);
    var c = ctx, now = c.currentTime, t0 = now + 0.05;
    var fadeIn = (opts && typeof opts.fadeIn === 'number') ? opts.fadeIn : def.fadeIn;
    var inst = { name: name, def: def, step: 0, next: t0, stopAt: null, nodes: [] };

    var out = c.createGain();
    out.gain.setValueAtTime(0, now);
    out.gain.setValueAtTime(0, t0);
    out.gain.linearRampToValueAtTime(def.level, t0 + Math.max(0.01, fadeIn));
    out.connect(bus.music);
    var fadeNode = out;
    if (def.radio) out = addRadio(inst, def.radio, fadeNode); // period "speaker" coloring + crackle

    // Per-track tempo-synced echo (feedback delay with damping)
    var dly = c.createDelay(2);
    dly.delayTime.value = Math.min(1.9, def.stepDur * def.echoSteps);
    var damp = c.createBiquadFilter();
    damp.type = 'lowpass';
    damp.frequency.value = 2200;
    var fb = c.createGain();
    fb.gain.value = def.echoFb;
    var wet = c.createGain();
    wet.gain.value = 0.55;
    dly.connect(damp); damp.connect(fb); fb.connect(dly);
    damp.connect(wet); wet.connect(out);

    inst.out = fadeNode;
    inst.nodes.push(fadeNode, out, dly, damp, fb, wet);

    // One small chain per part: [filter] -> gain -> [pan] -> out (+ echo send)
    inst.pn = def.parts.map(function (p) {
      var g = c.createGain();
      inst.nodes.push(g);
      if (p.drums) {
        g.gain.value = p.gain;
        g.connect(out);
        return { input: g };
      }
      var f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = p.inst.cut || 4000;
      f.Q.value = p.inst.q || 0.7;
      g.gain.value = p.inst.gain * p.gain;
      f.connect(g);
      var tail = g;
      if (p.pan && typeof c.createStereoPanner === 'function') {
        var pan = c.createStereoPanner();
        pan.pan.value = p.pan;
        g.connect(pan);
        tail = pan;
        inst.nodes.push(pan);
      }
      tail.connect(out);
      if (p.echo > 0) {
        var send = c.createGain();
        send.gain.value = p.echo;
        tail.connect(send);
        send.connect(dly);
        inst.nodes.push(send);
      }
      inst.nodes.push(f);
      return { input: f };
    });
    return inst;
  }

  function fadeOut(inst, dur) {
    var t = ctx.currentTime;
    var p = inst.out.gain;
    holdParam(p, t);
    p.linearRampToValueAtTime(0, t + Math.max(0.02, dur));
    inst.stopAt = t + Math.max(0.02, dur);
    fading.push(inst);
  }

  // Period playback coloring. Each era's music comes out of an era-appropriate
  // "speaker": a 1920s gramophone horn, a 1930s-40s tube radio, a 1950s jukebox,
  // or a 90s/2020 vinyl-sampled beat. Band-limiting + a looped crackle buffer.
  var RADIO = {
    gramophone: { hp: 480, lp: 2700, peakF: 1500, peakG: 5, clicks: 34, hiss: 0.014, crackle: 0.055 },
    radio:      { hp: 300, lp: 3400, peakF: 1800, peakG: 3, clicks: 10, hiss: 0.007, crackle: 0.04 },
    jukebox:    { hp: 70,  lp: 5200, peakF: 0,    peakG: 0, clicks: 3,  hiss: 0.003, crackle: 0.03 },
    vinyl:      { hp: 0,   lp: 0,    peakF: 0,    peakG: 0, clicks: 9,  hiss: 0.004, crackle: 0.045 }
  };

  function addRadio(inst, kind, dest) {
    var R = RADIO[kind] || RADIO.radio, c = ctx;
    var input = c.createGain(), node = input;
    inst.nodes.push(input);
    if (R.hp) { var hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = R.hp; node.connect(hp); node = hp; inst.nodes.push(hp); }
    if (R.lp) { var lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = R.lp; lp.Q.value = 0.9; node.connect(lp); node = lp; inst.nodes.push(lp); }
    if (R.peakF) { var pk = c.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = R.peakF; pk.gain.value = R.peakG; pk.Q.value = 0.8; node.connect(pk); node = pk; inst.nodes.push(pk); }
    node.connect(dest);
    // Crackle + hiss: 2 s buffer of sparse decaying clicks over faint noise, looped.
    try {
      var sr = c.sampleRate, len = Math.floor(sr * 2), buf = c.createBuffer(1, len, sr), dd = buf.getChannelData(0);
      for (var i = 0; i < len; i++) dd[i] = (Math.random() * 2 - 1) * R.hiss;
      for (var k = 0; k < R.clicks * 2; k++) {
        var at = Math.floor(Math.random() * (len - 200)), amp = (0.25 + Math.random() * 0.75) * (Math.random() < 0.5 ? -1 : 1);
        var decay = 4 + Math.random() * 24;
        for (var j = 0; j < 160; j++) dd[at + j] += amp * Math.exp(-j / decay);
      }
      var src = c.createBufferSource(), cg = c.createGain();
      src.buffer = buf; src.loop = true; cg.gain.value = R.crackle;
      src.connect(cg); cg.connect(dest);
      src.start(c.currentTime + 0.02);
      inst.srcs = [src];
      inst.nodes.push(cg);
    } catch (e) { /* crackle is optional */ }
    return input;
  }

  function teardown(inst) {
    if (inst.srcs) inst.srcs.forEach(function (s) { try { s.stop(); } catch (e) { /* ignore */ } });
    for (var i = 0; i < inst.nodes.length; i++) {
      try { inst.nodes[i].disconnect(); } catch (e) { /* ignore */ }
    }
    inst.nodes.length = 0;
  }

  /** Schedule one note of a melodic part. */
  function playNote(p, ev, t, stepDur, dest) {
    var c = ctx, I = p.inst;
    var dur = Math.max(0.04, ev.l * stepDur * p.gate);
    var peak = ev.v / Math.sqrt(ev.n.length);
    var a = I.a || 0.005, d = I.d || 0.1, s = I.s == null ? 0.7 : I.s, r = I.r || 0.06;
    var relAt = t + Math.max(dur, a + 0.005);
    var end = relAt + r * 2.5 + 0.03;
    if (s === 0) end = Math.min(end, t + a + d * 2.2 + 0.03); // plucks die on their own

    var g = c.createGain(), gp = g.gain;
    gp.setValueAtTime(0, t);
    gp.linearRampToValueAtTime(peak, t + a);
    if (s < 1) gp.setTargetAtTime(peak * s, t + a, Math.max(0.005, d / 3));
    if (relAt < end) gp.setTargetAtTime(0, relAt, Math.max(0.005, r / 3));
    g.connect(dest);

    var head = g;
    if (I.fenv) {
      var fl = c.createBiquadFilter();
      fl.type = 'lowpass';
      fl.Q.value = I.fq || 1;
      fl.frequency.setValueAtTime(I.fenv[0], t);
      fl.frequency.exponentialRampToValueAtTime(I.fenv[1], t + I.fenv[2]);
      fl.connect(g);
      head = fl;
    }

    for (var i = 0; i < ev.n.length; i++) {
      var f = mtof(ev.n[i] + p.transpose);
      var o = c.createOscillator();
      setWave(o, I.wave);
      o.frequency.setValueAtTime(f, t);
      if (I.bend) {
        o.detune.setValueAtTime(I.bend * 100, t);
        o.detune.linearRampToValueAtTime(0, t + (I.bendT || 0.06));
      }
      o.connect(head);
      o.start(t);
      o.stop(end);

      var o2 = null;
      if (I.wave2) {
        o2 = c.createOscillator();
        setWave(o2, I.wave2);
        o2.frequency.setValueAtTime(f * (I.ratio2 || 1), t);
        var det2 = I.detune2 || 0;
        if (I.bend) {
          o2.detune.setValueAtTime(det2 + I.bend * 100, t);
          o2.detune.linearRampToValueAtTime(det2, t + (I.bendT || 0.06));
        } else if (det2) {
          o2.detune.setValueAtTime(det2, t);
        }
        var g2 = c.createGain();
        g2.gain.value = I.mix2 == null ? 0.5 : I.mix2;
        o2.connect(g2);
        g2.connect(head);
        o2.start(t);
        o2.stop(end);
      }

      if (I.vib && dur > I.vib[2] + 0.08) {
        var lfo = c.createOscillator(), lg = c.createGain();
        lfo.frequency.value = I.vib[0];
        lg.gain.setValueAtTime(0, t);
        lg.gain.setValueAtTime(0, t + I.vib[2]);
        lg.gain.linearRampToValueAtTime(I.vib[1], t + I.vib[2] + 0.2);
        lfo.connect(lg);
        lg.connect(o.detune);
        if (o2) lg.connect(o2.detune);
        lfo.start(t);
        lfo.stop(end);
      }
    }
  }

  /** Schedule everything that starts on `step` of a track at time t. */
  function scheduleStep(inst, step, t) {
    var def = inst.def;
    if (step % 2 === 1) t += def.swing * def.stepDur;
    for (var i = 0; i < def.parts.length; i++) {
      var p = def.parts[i], dest = inst.pn[i].input;
      if (p.drums) {
        for (var j = 0; j < p.lanes.length; j++) {
          var L = p.lanes[j], v = L.hits[step % L.len];
          if (v) DRUMS[L.kind](t, v, dest);
        }
      } else {
        var evs = p.byStep[step % p.len];
        if (evs) for (var k = 0; k < evs.length; k++) playNote(p, evs[k], t, def.stepDur, dest);
      }
    }
  }

  function service(inst, now) {
    if (inst.next < now - 0.25) inst.next = now + 0.03; // timers were throttled: skip ahead, don't burst
    var horizon = now + LOOKAHEAD;
    if (inst.stopAt != null) horizon = Math.min(horizon, inst.stopAt);
    var silent = settings.muted || settings.master <= 0 || settings.music <= 0;
    var guard = 0;
    while (inst.next < horizon && guard++ < 64) {
      if (!silent) {
        try { scheduleStep(inst, inst.step, inst.next); } catch (e) { warnOnce('music "' + inst.name + '" error: ' + (e && e.message)); }
      }
      inst.step++;
      inst.next += inst.def.stepDur;
    }
  }

  function tick() {
    if (!ctx) return;
    var now = ctx.currentTime;
    if (current) service(current, now);
    for (var i = fading.length - 1; i >= 0; i--) {
      var f = fading[i];
      service(f, now);
      if (now > f.stopAt + 2.5) { teardown(f); fading.splice(i, 1); } // leave time for echo tails
    }
    if (!current && !fading.length && timer) { clearInterval(timer); timer = null; }
  }

  function ensureTimer() {
    if (timer || !ctx || typeof setInterval !== 'function') return;
    timer = setInterval(tick, TICK_MS);
  }

  /** Actually switch tracks (context exists and is unlocked). */
  function switchTo(name, opts) {
    var curName = current ? current.name : null;
    if (curName === name) return;
    var fade;
    if (opts && typeof opts.fade === 'number') fade = opts.fade;
    else if (name && TRACKS[name].cut) fade = 0.15; // pursuit/victory slam in
    else fade = name ? 0.7 : 0.9;
    if (current) { fadeOut(current, fade); current = null; }
    if (name) {
      try { current = startTrack(name, opts); } catch (e) { current = null; warnOnce('could not start "' + name + '": ' + (e && e.message)); }
    }
    ensureTimer();
    tick();
  }

  function music(name, opts) {
    name = name || null;
    if (name && !Object.prototype.hasOwnProperty.call(TRACKS, name)) {
      warnOnce('unknown music track "' + name + '"');
      return;
    }
    wantTrack = name;
    if (!ctx || !unlocked) return; // will start in unlock()
    switchTo(name, opts);
  }

  // ===========================================================================
  // Unlock, visibility, settings API
  // ===========================================================================

/*
 * street.js — Doyers Street, looking down the block toward the sharp bend
 * (the "Bloody Angle"), with Nom Wah's storefront tucked into the crook.
 *
 *   ART.street('1920' | 'today') -> svg markup (1600×900)
 *
 * Today: the faded pink (once red) awning, the 南華茶室 sign, the painted
 * "Rice Terraces" street mural (2021), strings of lanterns, and the street is
 * pedestrian-only by day (since a 2017 pilot) — so no cars, just a line.
 */
(function (root) {
  'use strict';

  // perspective helpers for the two receding side walls
  function lerp(a, b, t) { return a + (b - a) * t; }
  /** Quad on the left wall. u: 0 (near, x=0) → 1 (far, x=470). v: 0 (top) → 1 (ground). */
  function leftPt(u, v) {

    return [x, lerp(top, bot, v)];

    return [x, lerp(top, bot, v)];
  }
  function quad(fn, u0, u1, v0, v1, fill, extra) {
    var a = fn(u0, v0), b = fn(u1, v0), c = fn(u1, v1), d = fn(u0, v1);
    return '<path d="M ' + a.join(' ') + ' L ' + b.join(' ') + ' L ' + c.join(' ') + ' L ' + d.join(' ') + ' Z" fill="' + fill + '"' + (extra || '') + '/>';
  }

  function sideWall(fn, wall, era, side) {
    var out = quad(fn, 0, 1, 0, 1, wall);
    // windows: 4 floors × 5 bays
    for (var f = 0; f < 4; f++) {

        { id: 'guide', scene: 'street', actor: 'guide26', label: 'Tour guide', required: true, script: [
          ['guide26', 'And here, in the crook of Doyers Street: Nom Wah Tea Parlor, open since 1920!', 'happy'],
          ['guide26', 'See that pink awning? It used to be bright red. Years of sunshine will do that.'],
          ['guide26', 'A bakery, a tea parlor, dim sum carts, now cooked-to-order dim sum… It keeps changing just enough to stay the same.']
        ] },
        { id: 'sign', scene: 'street', label: 'Sign', at: [800, 300], area: [650, 286, 300, 150], script: [
          ['narr', '南華茶室 — Nom Wah Tea Parlor. The Chinese name means, roughly, "South China Tea House."']
        ] },
        { id: 'mural', scene: 'street', label: 'Street mural', at: [330, 700], area: [200, 640, 520, 260], script: [
          ['narr', 'The street itself is painted with a giant mural called "Rice Terraces." Doyers Street belongs to people now, not cars.']

      next: 'See what you learned'
    }
  ];

  // ---------------------------------------------------------------- the ending
  var ENDING = {
    title: 'One table. 100+ years.',
    question: 'How has Nom Wah stayed in business, and kept its history, for more than a century?',
    ingredients: [
      { icon: 'almond_cookie', name: 'Great pastries & tea', text: 'Almond cookies and mooncakes kept the lights on for decades. The bakery came first.' },
      { icon: 'cha_siu_bao', name: 'Hard work, passed down', text: 'Wally went from dishwasher (1950) to manager to owner (1974), then passed it on to Wilson (2010).' },
      { icon: 'tea', name: 'Keep the old room', text: 'The booths, the tin ceiling, the tile floor and the century-old glass counter are all still there.' },
      { icon: 'egg_roll', name: 'Change what matters', text: 'Carts gave way to cooked-to-order dishes, dim sum ran into the night, and Nom Wah went online.' },
      { icon: 'har_gow', name: 'Resilience & community', text: 'Like its Chinatown neighbors, Nom Wah stayed resourceful and resilient, and kept showing up for the community, even in 2020.' }
    ]
  };

  var SOURCES = [
    { t: 'Tenement Museum — "Tea Time: The Story of the Nom Wah Tea Parlor"', u: 'https://www.tenement.org/blog/tea-time-the-story-of-the-nom-wah-tea-parlor/' },
    { t: 'City Lore / Place Matters — Nom Wah Tea Parlor', u: 'https://citylore.org/places/nom-wah-tea-parlor/' },
    { t: 'Columbia Business School — Nom Wah Tea Parlor: A 90-Year Legacy', u: 'https://business.columbia.edu/global-family-enterprise/family-enterprise-insights/nom-wah-tea-parlor-90-year-legacy-family-and' },
    { t: 'The New Yorker (2020) — The Oldest Restaurant in Manhattan\'s Chinatown Faces the Coronavirus Shutdown', u: 'https://www.newyorker.com/magazine/2020/03/30/the-oldest-restaurant-in-manhattans-chinatown-faces-the-coronavirus-shutdown' },
    { t: 'Grub Street (2023)', u: 'https://www.grubstreet.com/2023/05/nom-wah-tea-parlor-nyc-lawsuit.html' },
    { t: 'The New York Times (1994) — Chinatown: On Pell Street, Only Memories of a Violent Past', u: 'https://www.nytimes.com/1994/06/12/nyregion/neighborhood-report-chinatown-on-pell-street-only-memories-of-a-violent-past.html' },
    { t: 'NYPL — Author Talk: The Nom Wah Cookbook', u: 'https://www.nypl.org/blog/2022/06/24/author-talk-nom-wah-cookbook' },
    { t: 'Nom Wah Tea Parlor — Our Story / Chinatown', u: 'https://www.nomwah.com/chinatown' },
    { t: 'Cookery by the Book — The Nom Wah Cookbook with Wilson Tang (tea cabinet, "if it\'s not broken")', u: 'https://www.cookerybythebook.com/home/2020/12/27/the-nom-wah-cookbook-wilson-tang' },
    { t: 'MOFAD City — Nom Wah (carts under Wally)', u: 'http://city.mofad.org/chinatown/explore/nomwah' },
    { t: 'Signal v. Noise — Steeped in History (card games, what Wilson kept)', u: 'https://signalvnoise.com/svn3/steeped-in-history/' },
    { t: 'Resy (2020) — The Enduring Value of New York\'s Oldest Chinese Restaurant', u: 'https://blog.resy.com/2020/08/the-enduring-value-of-new-yorks-oldest-chinese-restaurant/' },
    { t: 'AP via Mining Journal (2020) — Nom Wah at 100: a cookbook about a restaurant & community', u: 'https://www.miningjournal.net/life/saturday-food-drink/2020/11/nom-wah-at-100-a-cookbook-about-a-restaurant-community/' },
